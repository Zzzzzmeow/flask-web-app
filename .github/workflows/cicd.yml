name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # CI：单元测试
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: python -m unittest discover -s tests -v

  # CD：测试通过后自动部署到服务器
  deploy:
    name: 部署到服务器
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH 私钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 上传项目文件到服务器
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p ~/flask-web-app"
          scp -o StrictHostKeyChecking=no -P ${{ secrets.SSH_PORT }} -r src requirements.txt ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/flask-web-app/

      - name: 安装依赖并重启应用
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd ~/flask-web-app
            pip3 install -r requirements.txt -q
            pkill -f 'python3.*app.py' || true
            nohup python3 src/app.py > app.log 2>&1 &
            sleep 2
            curl -s http://127.0.0.1:5000/
          "
