name: Deploy Flask App to Touge Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false

      - name: Deploy to Touge Server via SSH (Port 52811)
        run: |
          # 配置SSH环境
          mkdir -p ~/.ssh

          # 提取并清洗私钥：去除\r，只保留 BEGIN/END 之间的密钥行（自动剔除粘贴带入的多余内容）
          printf "%s\n" "${{ secrets.TOUGE_SSH_PRIVATE_KEY }}" | tr -d '\r' | sed -n '/BEGIN OPENSSH PRIVATE KEY/,/END OPENSSH PRIVATE KEY/p' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 校验私钥格式（若Secret配置错误会在此处明确报错）
          if ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "KEY_FORMAT_OK $(ssh-keygen -lf ~/.ssh/id_rsa)"
          else
            echo "::error::私钥Secret格式无效，请检查 TOUGE_SSH_PRIVATE_KEY 是否为完整私钥内容（含BEGIN/END行）"
            exit 1
          fi

          # 扫描主机密钥（指定端口）
          ssh-keyscan -p 52811 -H ${{ secrets.TOUGE_SERVER_IP }} >> ~/.ssh/known_hosts
          echo "SSH环境配置完成，尝试连接服务器..."

          # 确保项目目录存在
          ssh -p 52811 -o StrictHostKeyChecking=accept-new -o PubkeyAcceptedAlgorithms=+ssh-rsa root@${{ secrets.TOUGE_SERVER_IP }} "mkdir -p /root/flask-web-app"

          # 上传最新代码（服务器无法直连github.com，用scp代替git pull）
          scp -P 52811 -o StrictHostKeyChecking=accept-new -o PubkeyAcceptedAlgorithms=+ssh-rsa -r src requirements.txt root@${{ secrets.TOUGE_SERVER_IP }}:/root/flask-web-app/

          # 安装依赖并通过supervisor重启应用
          ssh -p 52811 -o StrictHostKeyChecking=accept-new -o PubkeyAcceptedAlgorithms=+ssh-rsa root@${{ secrets.TOUGE_SERVER_IP }} "
            cd /root/flask-web-app
            pip3 install -r requirements.txt -q || pip3 install -r requirements.txt -q --break-system-packages
            supervisorctl restart flask-web-app || supervisorctl start flask-web-app
            supervisorctl status flask-web-app
            sleep 2
            curl -s http://127.0.0.1:5000/ && echo
          "
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
